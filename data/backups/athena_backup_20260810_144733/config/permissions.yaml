assistant:
  name: Athena
  version: "0.1.0"

voice:
  wake_word: "hey athena"
  enabled: true

ollama:
  enabled: true
  host: "http://127.0.0.1:11434"
  model: "qwen3.5:9b"
  embedding_model: "nomic-embed-text"

openclaw:
  enabled: false
  endpoint: "http://127.0.0.1:18789"

permissions:
  auto_execute_low_risk: true
  confirm_medium_risk: true
  confirm_high_risk: true
  deny_critical_by_default: true

monitoring:
  enabled: true

risk:
  low:
    - open_application
    - close_application
    - search_files
    - search_web
    - open_url
    - read_file
    - list_files
    - get_file_info
    - get_system_status
    - list_processes
    - query_documents
    - list_ingested_documents
    - take_screenshot
    - read_screen
  medium:
    - create_file
    - write_file
    - copy_file
    - move_file
    - rename_file
    - run_python_script
    - run_cmd_command
    - run_powershell_command
    - ingest_document
    - click_text
    - type_text
    - press_key
  high:
    - delete_file
    - shutdown_pc
    - restart_pc
    - sleep_pc
  critical: []
