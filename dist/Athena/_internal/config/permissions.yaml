assistant:
  name: Athena
  version: "0.1.0"

voice:
  wake_word: "hey athena"
  enabled: true

ollama:
  enabled: true
  host: "http://127.0.0.1:11434"
  model: "qwen3.5:9b"
  embedding_model: "nomic-embed-text"

openclaw:
  enabled: false
  endpoint: "http://127.0.0.1:18789"

permissions:
  auto_execute_low_risk: true
  confirm_medium_risk: true
  confirm_high_risk: true
  deny_critical_by_default: true

monitoring:
  enabled: true

risk:
  low:
    - open_application
    - close_application
    - search_files
    - search_web
    - open_url
    - list_workflows
    - mission_status
    - check_docker
    - list_containers
    - docker_compose_ps
    - check_clickhouse
    - clickhouse_databases
    - clickhouse_tables
    - check_airflow
    - list_airflow_dags
    - airflow_dag_runs
    - check_mysql
    - check_data_stack
    - analyze_csv
    - analyze_excel
    - profile_dataset
    - list_email_drafts
    - read_email_draft
    - search_email_drafts
    - search_inbox
    - read_email
    - read_file
    - list_files
    - get_file_info
    - get_system_status
    - list_processes
    - query_documents
    - list_ingested_documents
    - take_screenshot
    - read_screen
    - find_on_screen
    - git_status
    - git_diff
    - git_log
    - inspect_traceback
    - read_project
  medium:
    - create_file
    - write_file
    - copy_file
    - move_file
    - rename_file
    - run_workflow
    - clickhouse_query
    - draft_email
    - run_python_script
    - run_python
    - run_tests
    - create_branch
    - create_project
    - write_code
    - run_cmd_command
    - run_powershell_command
    - ingest_document
    - click_text
    - click_at
    - type_text
    - press_key
    - scroll_screen
  high:
    - delete_file
    - send_email
    - git_commit
    - shutdown_pc
    - restart_pc
    - sleep_pc
  critical: []
