<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Athena — Owl's Vigil</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --void:#0A0C10;
  --panel:#12151C;
  --panel-edge:#1E222C;
  --gold:#D8B45C;
  --gold-dim:#8A733A;
  --teal:#4C7B72;
  --ivory:#E9E2D0;
  --ivory-dim:#8B8778;
  --danger:#B0553F;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse 900px 600px at 82% 20%, rgba(76,123,114,0.10), transparent 60%),
    radial-gradient(ellipse 700px 500px at 15% 85%, rgba(216,180,92,0.06), transparent 60%),
    linear-gradient(160deg, #06070A, #0D1016 55%, #090A0D);
  font-family:'Inter', sans-serif;
  color:var(--ivory);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:48px 24px;
}

.desktop-frame{
  width:100%;
  max-width:1180px;
  position:relative;
}
.desktop-hint{
  font-size:11px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--ivory-dim);
  text-align:center;
  margin-bottom:28px;
  opacity:0.55;
}

.dock{
  display:flex;
  justify-content:flex-end;
  align-items:flex-start;
}

.hud{
  width:340px;
  background:linear-gradient(180deg, var(--panel), #0E1015);
  border:1px solid var(--panel-edge);
  border-radius:18px;
  padding:26px 24px 20px;
  position:relative;
  box-shadow:0 30px 80px -30px rgba(0,0,0,0.7), 0 0 0 1px rgba(216,180,92,0.04);
}
.hud::before{
  content:'';
  position:absolute;
  inset:0;
  border-radius:18px;
  padding:1px;
  background:linear-gradient(140deg, rgba(216,180,92,0.35), transparent 40%, transparent 70%, rgba(76,123,114,0.25));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
}

.wordmark{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:22px;
}
.wordmark .glyph{
  width:20px; height:20px;
  border:1.4px solid var(--gold);
  border-radius:50%;
  position:relative;
  flex-shrink:0;
}
.wordmark .glyph::after{
  content:'';
  position:absolute;
  left:50%; top:50%;
  width:2px; height:9px;
  background:var(--gold);
  transform:translate(-50%,-50%);
  border-radius:1px;
}
.wordmark span{
  font-family:'Cinzel', serif;
  font-size:15px;
  letter-spacing:0.22em;
  color:var(--ivory);
  font-weight:600;
}
.wordmark .sub{
  font-family:'Inter', sans-serif;
  font-size:10px;
  letter-spacing:0.1em;
  color:var(--ivory-dim);
  margin-left:auto;
  text-transform:uppercase;
}

.orb-stage{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px 0 6px;
  position:relative;
}
.rings{
  position:absolute;
  width:170px; height:170px;
  border-radius:50%;
  border:1px solid rgba(216,180,92,0.14);
}
.rings.r2{ width:200px; height:200px; border-color:rgba(76,123,114,0.14);}

.orb{
  width:132px; height:132px;
  border-radius:50%;
  position:relative;
  background:radial-gradient(circle at 38% 32%, #1B1F28, #0A0C10 70%);
  border:1px solid rgba(216,180,92,0.3);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:box-shadow 0.6s ease, border-color 0.6s ease;
  box-shadow:0 0 0 0 rgba(216,180,92,0);
}
.orb.listening{
  border-color:rgba(216,180,92,0.6);
  box-shadow:0 0 40px -6px rgba(216,180,92,0.35);
}
.orb.thinking{
  border-color:rgba(76,123,114,0.6);
  box-shadow:0 0 40px -6px rgba(76,123,114,0.35);
}
.orb.speaking{
  border-color:rgba(216,180,92,0.75);
  box-shadow:0 0 52px -4px rgba(216,180,92,0.5);
}

.iris{
  width:58px; height:58px;
  border-radius:50%;
  background:radial-gradient(circle at 42% 38%, #3A3220, #16130C 65%);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
.pupil{
  width:9px; height:30px;
  background:var(--gold);
  border-radius:5px;
  transition:height 0.4s ease, width 0.4s ease, opacity 0.4s ease;
}
.orb.listening .pupil{ height:22px; }
.orb.thinking .pupil{ height:12px; width:12px; border-radius:50%; }
.orb.speaking .pupil{ height:26px; }

.bars{
  position:absolute;
  inset:0;
}
.bars i{
  position:absolute;
  left:50%; top:50%;
  width:2px;
  height:4px;
  background:var(--gold-dim);
  border-radius:2px;
  transform-origin:center 66px;
  opacity:0.5;
}

.status-row{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-top:16px;
}
.status-text{
  font-size:13px;
  color:var(--ivory);
  font-weight:500;
}
.status-text .dot{
  display:inline-block;
  width:6px; height:6px;
  border-radius:50%;
  background:var(--teal);
  margin-right:7px;
}
.hint{
  font-size:11px;
  color:var(--ivory-dim);
  font-family:'JetBrains Mono', monospace;
}

.vitals{
  display:flex;
  gap:10px;
  margin-top:18px;
}
.vital{
  flex:1;
  background:rgba(255,255,255,0.02);
  border:1px solid var(--panel-edge);
  border-radius:10px;
  padding:9px 10px;
}
.vital .label{
  font-size:9px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--ivory-dim);
  margin-bottom:5px;
}
.vital .track{
  height:3px;
  background:#1D212A;
  border-radius:2px;
  overflow:hidden;
}
.vital .fill{
  height:100%;
  border-radius:2px;
  background:var(--teal);
}
.vital.cpu .fill{ width:34%; }
.vital.ram .fill{ width:57%; background:var(--gold-dim);}
.vital.net .fill{ width:12%; }

.log{
  margin-top:18px;
  border-top:1px solid var(--panel-edge);
  padding-top:14px;
}
.log .entry{
  display:flex;
  gap:9px;
  font-size:11.5px;
  color:var(--ivory-dim);
  padding:4px 0;
  font-family:'JetBrains Mono', monospace;
}
.log .entry .time{
  color:#5B5748;
  flex-shrink:0;
}
.log .entry.active{ color:var(--ivory); }

.controls{
  display:flex;
  gap:8px;
  margin-top:20px;
  justify-content:center;
}
.controls button{
  font-family:'Inter', sans-serif;
  font-size:10.5px;
  letter-spacing:0.05em;
  text-transform:uppercase;
  color:var(--ivory-dim);
  background:transparent;
  border:1px solid var(--panel-edge);
  border-radius:20px;
  padding:6px 13px;
  cursor:pointer;
  transition:all 0.2s ease;
}
.controls button:hover{ color:var(--ivory); border-color:var(--gold-dim); }
.controls button.active{ color:#0A0C10; background:var(--gold); border-color:var(--gold); }
</style>
</head>
<body>

<div class="desktop-frame">
  <div class="desktop-hint">Concept 01 — Owl's Vigil · always-on-top corner widget</div>
  <div class="dock">
    <div class="hud">
      <div class="wordmark">
        <div class="glyph"></div>
        <span>ATHENA</span>
        <div class="sub" id="modeLabel">Idle</div>
      </div>

      <div class="orb-stage">
        <div class="rings r2"></div>
        <div class="rings r1"></div>
        <div class="orb" id="orb">
          <div class="bars" id="bars"></div>
          <div class="iris"><div class="pupil"></div></div>
        </div>
      </div>

      <div class="status-row">
        <div class="status-text"><span class="dot"></span><span id="statusText">Say "Athena" to begin</span></div>
        <div class="hint">⌥ Space</div>
      </div>

      <div class="vitals">
        <div class="vital cpu"><div class="label">CPU</div><div class="track"><div class="fill"></div></div></div>
        <div class="vital ram"><div class="label">Memory</div><div class="track"><div class="fill"></div></div></div>
        <div class="vital net"><div class="label">Network</div><div class="track"><div class="fill"></div></div></div>
      </div>

      <div class="log">
        <div class="entry active"><span class="time">now</span><span>Opened Figma, muted Slack</span></div>
        <div class="entry"><span class="time">2m</span><span>Set a timer for 25 minutes</span></div>
        <div class="entry"><span class="time">14m</span><span>Summarized 3 unread emails</span></div>
      </div>

      <div class="controls">
        <button data-mode="idle" class="active">Idle</button>
        <button data-mode="listening">Listening</button>
        <button data-mode="thinking">Thinking</button>
        <button data-mode="speaking">Speaking</button>
      </div>
    </div>
  </div>
</div>

<script>
const orb = document.getElementById('orb');
const bars = document.getElementById('bars');
const buttons = document.querySelectorAll('.controls button');
const statusText = document.getElementById('statusText');
const modeLabel = document.getElementById('modeLabel');

const N = 28;
const barEls = [];
for(let i=0;i<N;i++){
  const b = document.createElement('i');
  const angle = (i/N) * 360;
  b.style.transform = `translate(-50%,-50%) rotate(${angle}deg) translateY(-58px)`;
  bars.appendChild(b);
  barEls.push(b);
}

const messages = {
  idle: 'Say "Athena" to begin',
  listening: 'Listening…',
  thinking: 'Working on it…',
  speaking: 'Muting Slack, opening Figma'
};

let mode = 'idle';
function setMode(m){
  mode = m;
  orb.className = 'orb' + (m !== 'idle' ? ' ' + m : '');
  statusText.textContent = messages[m];
  modeLabel.textContent = m.charAt(0).toUpperCase() + m.slice(1);
  buttons.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === m));
}

buttons.forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));

function animateBars(){
  barEls.forEach((b, i) => {
    let h = 4;
    if(mode === 'listening') h = 4 + Math.random()*16 * (0.4 + 0.6*Math.sin(Date.now()/200 + i));
    if(mode === 'speaking') h = 4 + Math.random()*20 * (0.4 + 0.6*Math.sin(Date.now()/150 + i*0.7));
    if(mode === 'thinking') h = 4 + 6*Math.abs(Math.sin(Date.now()/400 + i*0.5));
    b.style.height = Math.max(3, h) + 'px';
    b.style.opacity = mode === 'idle' ? 0.25 : 0.75;
  });
  requestAnimationFrame(animateBars);
}
animateBars();
setMode('idle');
</script>
</body>
</html>
